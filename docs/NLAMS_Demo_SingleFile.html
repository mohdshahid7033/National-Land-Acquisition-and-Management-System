.login::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(248,250,253,.93) 0%,rgba(248,250,253,.74) 40%,rgba(248,250,253,.3) 72%,rgba(248,250,253,.12) 100%)}
.lg-inner{position:relative;z-index:1;flex:1;display:flex;align-items:stretch;gap:30px;max-width:1230px;width:100%;margin:0 auto;padding:42px 40px 24px}
.lg-left{flex:1.05;display:flex;flex-direction:column;padding:8px 8px 0 0;color:var(--navy)}
.lg-emblem{width:62px;height:auto;filter:drop-shadow(0 2px 5px rgba(15,30,60,.28))}
.lg-govt{margin-top:9px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5b6b84}
.lg-govt b{display:block;font-size:12.5px;letter-spacing:.08em;color:var(--navy);text-transform:none;margin-top:2px}
.lg-hero{margin-top:5vh;max-width:520px}
.lg-hero h1{font-size:38px;line-height:1.16;font-weight:800;color:#122a4e;letter-spacing:-.01em}
.lg-hero p{margin-top:12px;font-size:15px;color:#41556f;max-width:450px}
.lg-rule{display:flex;gap:5px;margin:20px 0 26px}
.lg-rule i{height:3.5px;border-radius:3px;width:36px;display:block}
.lg-feats{display:flex;flex-direction:column;gap:16px;margin-top:auto;margin-bottom:24px}
.lg-feat{display:flex;gap:13px;align-items:flex-start;max-width:430px}
.lg-feat .fb{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#fff;box-shadow:0 3px 10px rgba(15,30,60,.18)}
.lg-feat b{display:block;font-size:14.5px;color:#16283f}
.lg-feat span{font-size:12.5px;color:#51617a}
.lg-copy{font-size:12px;color:#5a6b84;padding:10px 0 0}
.lg-right{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 0}

.gis-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}

.modal h3{font-size:16.5px;margin-bottom:2px}

.mx{float:right;color:#94a3b8;padding:4px;border-radius:8px}

.tg::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}

}

  if(!DAGG[dn])DAGG[dn]={prjs:[],land:0,fam:0,risk:0,status:'On Track'};
  const a=DAGG[dn];a.prjs.push(p.id);a.land+=p.land;a.fam+=p.fam;
  a.risk=Math.max(a.risk,p.risk);
  if(RANK[p.status]>RANK[a.status])a.status=p.status;
}));
Object.values(DAGG).forEach(a=>{
  if(a){a.prog=Math.round(a.prjs.reduce((s,id)=>s+prj(id).prog*prj(id).land,0)/a.land);}
});
const KPI=(()=>{
  const k={projects:PROJECTS.length,land:0,acq:0,fam:0,riskN:0,comp:0,compPaid:0,prog:0};
  PROJECTS.forEach(p=>{k.land+=p.land;k.acq+=Math.round(p.land*p.acq/100);k.fam+=p.fam;
    if(p.status!=='On Track')k.riskN++;
    k.comp+=Math.round(p.land*p.acq/100*p.avgL*1.18/100);});
  k.prog=Math.round(PROJECTS.reduce((s,p)=>s+p.prog*p.land,0)/k.land);
  k.compPaid=Math.round(k.comp*0.806);return k;
})();

/* district color by mode */
function distColor(name,mode){
  const a=DAGG[name];
  if(!a)return '#e2e8f0';
  if(mode==='status')return ST_COL[a.status];
  if(mode==='progress'){const t=a.prog/100;return `rgb(${Math.round(240-140*t)},${Math.round(245-95*t)},${Math.round(248-180*t)})`;}
  const t=Math.min(a.risk,100)/100;return `rgb(${Math.round(248-140*t)},${Math.round(250-175*t)},${Math.round(252-160*t)})`;
}
function lerpHex(a,b,t){return '#'+[0,1,2].map(i=>Math.round(a[i]+(b[i]-a[i])*t).toString(16).padStart(2,'0')).join('');}

/* deterministic parcels per project+district */
const PCL_DISPUTED2='#ef4444';
const CORR={};                                   /* corridor cache per project */

/* ---- route alignment geometry ---- */
function catmull(ctl,closed,n){
  const P=ctl,out=[];const get=i=>closed?P[(i+P.length)%P.length]:P[Math.max(0,Math.min(P.length-1,i))];
  const segs=closed?P.length:Math.max(1,P.length-1);
  for(let s=0;s<segs;s++){
    const p0=get(s-1),p1=get(s),p2=get(s+1),p3=get(s+2);
    const steps=Math.max(4,Math.round(n/segs));
    for(let t=0;t<steps;t++){const u=t/steps,u2=u*u,u3=u2*u;
      out.push([
        .5*((2*p1[0])+(-p0[0]+p2[0])*u+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*u2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*u3),
        .5*((2*p1[1])+(-p0[1]+p2[1])*u+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*u2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*u3)]);
    }
  }
  if(!closed&&P.length)out.push(P[P.length-1].slice());
  return out;
}
const dCen=n=>{const d=MAP.districts.find(x=>x.n===n);return [d.cx,d.cy];};
function routeFor(p){
  if(CORR[p.id])return CORR[p.id].route;
  const R=rng(p.id+'route');let wps=[],closed=false;
  if(p.id==='NLAMS-TG-003'){                     /* Warangal ORR — closed ring */
    const c=dCen('Warangal Urban');closed=true;
    const rx=112,ry=84,n=22;
    for(let i=0;i<n;i++){const a=i/n*2*Math.PI;
      wps.push([c[0]+Math.cos(a)*rx*(1+(R()-.5)*.16), c[1]+Math.sin(a)*ry*(1+(R()-.5)*.16)]);}
  } else {
    wps=p.dists.map(dCen);
    const ins=[];
    for(let i=0;i<wps.length-1;i++){
      ins.push(wps[i]);
      const mx=(wps[i][0]+wps[i+1][0])/2, my=(wps[i][1]+wps[i+1][1])/2;
      if(p.id==='NLAMS-TG-001') ins.push([mx,my-72]);          /* arc bows north around Hyderabad */
      else if(p.id==='NLAMS-TG-004') ins.push([mx+30,my+30]);  /* metro curves via outskirts */
      else ins.push([mx+(R()-.5)*90, my+(R()-.5)*90]);         /* natural S-curve */
    }
    ins.push(wps[wps.length-1]);wps=ins;
  }
  const pts=catmull(wps,closed,150).map((q,i)=>[q[0]+Math.sin(i*.7)*5+(R()-.5)*5, q[1]+Math.cos(i*.5)*4+(R()-.5)*5]);
  let len=0;for(let i=1;i<pts.length;i++)len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  return {pts,closed,len:Math.round(len)};
}
function fitRouteVB(p){
  const rt=routeFor(p).pts;
  const x0=Math.min(...rt.map(q=>q[0]))-80,y0=Math.min(...rt.map(q=>q[1]))-80;
  return [x0,y0,Math.max(...rt.map(q=>q[0]))-x0+80,Math.max(...rt.map(q=>q[1]))-y0+80];
}
/* ---- land corridor: parcels strung along the alignment ---- */
function corridorFor(p){
  if(CORR[p.id])return CORR[p.id];
  const route=routeFor(p);const R=rng(p.id+'cor');const pts=route.pts;
  const n=route.closed?36:30;const parcels=[];
  const acq=p.acq/100;
  for(let i=0;i<n;i++){
    const t=(i+.5)/n;
    const fi=t*(pts.length-1);const idx=Math.min(pts.length-2,Math.floor(fi));const ft=fi-idx;
    const a=pts[idx],b=pts[idx+1];
    const dx=b[0]-a[0],dy=b[1]-a[1];const L=Math.hypot(dx,dy)||1;
    const nx=-dy/L,ny=dx/L;
    const off=(R()-.5)*54;
    const cx=a[0]+dx*ft+nx*off, cy=a[1]+dy*ft+ny*off;
    const ang=Math.atan2(dy,dx),cA=Math.cos(ang),sA=Math.sin(ang);
    const L2=9+R()*9,W2=6.5+R()*6.5;
    const corner=(ux,uy)=>[(cx+ux*cA-uy*sA).toFixed(1),(cy+ux*sA+uy*cA).toFixed(1)];
    const poly=[corner(-L2,-W2),corner(L2,-W2*.8),corner(L2*.9,W2),corner(-L2*.85,W2*.9)].map(q=>q.join(',')).join(' ');
    const r=R();let stage;
    if(r<.06&&t>.2)stage='Disputed';
    else if(t<acq*.8)stage=r<.68?'Compensated':r<.9?'Possession':'Awarded';
    else if(t<acq)stage=r<.5?'Possession':'Awarded';
    else if(t<acq+.14)stage='Awarded';
    else if(t<acq+.46)stage='Verified';
    else stage='Notified';
    parcels.push({
      id:'SP-'+String(i+1).padStart(2,'0'),
      survey:(p.dists[i%p.dists.length].slice(0,3).toUpperCase())+'/'+(21+Math.floor(R()*70))+'/'+(1+Math.floor(R()*320)),
      owner:OWNER_NAMES[Math.floor(R()*OWNER_NAMES.length)],
      cat:CATS[Math.floor(R()*CATS.length)],
      area:+(0.32+R()*3.4).toFixed(2),
      village:p.vil[Math.floor(R()*p.vil.length)],
      stage,t,poly
    });
  }
  CORR[p.id]={route,parcels};
  return CORR[p.id];
}
/* array interface kept for verification module & seeds */
function parcelsFor(p){return corridorFor(p).parcels;}

/* deterministic family rows */
function famRows(p,n){
  const R=rng(p.id+'fam');const out=[];
  for(let i=0;i<n;i++){
    const paid=R()<(p.status==='Delayed'?0.6:0.85);
    out.push({id:'F-'+(1000+Math.floor(R()*8999)),head:OWNER_NAMES[Math.floor(R()*OWNER_NAMES.length)],
      cat:CATS[Math.floor(R()*CATS.length)],village:p.vil[Math.floor(R()*p.vil.length)],
      area:+(0.2+R()*2.2).toFixed(2),award:+(p.avgL*(0.5+R()*1.6)).toFixed(1),paid,rr:R()<(p.stage==='Compensation'||p.stage==='Possession'?0.72:0.4)});
  }
  return out;
}

function donut(parts,size){

    const xi1=cx+r*Math.cos(a1),yi1=cy+r*Math.sin(a1),xi0=cx+r*Math.cos(a0),yi0=cy+r*Math.sin(a0);
    const la=a1-a0>Math.PI?1:0;
    segs+=`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${la} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} L${xi1.toFixed(1)} ${yi1.toFixed(1)} A${r} ${r} 0 ${la} 0 ${xi0.toFixed(1)} ${yi0.toFixed(1)}Z" fill="${p.c}" stroke="#fff" stroke-width="1.5"/>`;

   · mapSVG(): districts + route alignment + workflow-coloured parcels

   · gisHTML(): state → district → project-alignment drill-down
   · mountMap(): tooltips, drag-pan, clicks · gzoom(): zoom controls
   ===================================================================== */
function mapSVG(opts){
  const o=opts||{};const mode=o.mode||'status';const mini=!!o.mini;
  const inRoute=dn=>!o.align||o.routeDists.includes(dn);
  const paths=MAP.districts.map(d=>{
    const sel = o.selDist===d.n;
    const fill = inRoute(d.n)?distColor(d.n,mode):'#eef1f5';
    return `<path class="md" data-d="${d.n}" d="${d.d}" fill="${fill}" stroke="${sel?'#1d4ed8':'#ffffff'}" stroke-width="${sel?3:(mini?1:1.5)}" ${inRoute(d.n)?'':'opacity=".75"'}/>`;
  }).join('');
  let vb=o.vb||`0 0 ${MAP.w} ${MAP.h}`;
  let extra='';
  if(o.align){
    const rt=o.align.pts;
    const dPath='M'+rt.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L');
    const nA=Math.max(2,Math.round(rt.length*Math.min(o.align.acq,100)/100));
    const dDone='M'+rt.slice(0,nA).map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L');
    const st=rt[0],en=rt[rt.length-1];
    extra+=`<path d="${dPath}" fill="none" stroke="#1f2937" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>`;
    extra+=`<path d="${dDone}" fill="none" stroke="#16a34a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>`;
    extra+=`<path d="${dPath}" fill="none" stroke="#f1f5f9" stroke-width="1.2" stroke-dasharray="8 7" opacity=".85"/>`;
    extra+=`<circle cx="${st[0].toFixed(1)}" cy="${st[1].toFixed(1)}" r="7" fill="#16a34a" stroke="#fff" stroke-width="2.5"/><text x="${st[0].toFixed(1)}" y="${(st[1]+3).toFixed(1)}" text-anchor="middle" font-size="8" font-weight="800" fill="#fff">S</text>`;
    extra+=`<circle cx="${en[0].toFixed(1)}" cy="${en[1].toFixed(1)}" r="7" fill="#0f172a" stroke="#fff" stroke-width="2.5"/><text x="${en[0].toFixed(1)}" y="${(en[1]+3).toFixed(1)}" text-anchor="middle" font-size="8" font-weight="800" fill="#fff">E</text>`;
    extra+=o.align.parcels.map((p,i)=>{
      const c=p.stage==='Disputed'?PCL_DISPUTED:PCL_COL[p.stage];
      const dim=S.flowFilter&&p.stage!==S.flowFilter&&p.stage!=='Disputed';
      return `<polygon class="pcl" data-p="${i}" points="${p.poly}" fill="${c}" fill-opacity="${dim?'.14':'.92'}" stroke="#fff" stroke-width="1.1" vector-effect="non-scaling-stroke"/>`;
    }).join('');
  }
  return `<svg id="${o.id||'tmap'}" viewBox="${vb}" preserveAspectRatio="xMidYMid meet" style="${o.style||'width:100%;height:auto;display:block'}">
    <g>${paths}${extra}</g></svg>`;
}

function flowStrip(p){
  const idx=STAGES.indexOf(p.stage);
  return `<div class="mapflow">${STAGES.map((s,i)=>`<div class="mfs ${i<idx?'done':i===idx?'act':''}" data-act="flowf" data-s="${s}" title="Click to highlight parcels at stage: ${s}"><span class="mn">${i<idx?'✓':i+1}</span><span>${s}</span></div>${i<STAGES.length-1?'<span class="mfs-arrow">→</span>':''}`).join('')}</div>`;
}
function stageLegend(counts){
  return Object.keys(PCL_COL).map(k=>`<div class="li" style="${S.flowFilter===k?'':'opacity:.55'};cursor:pointer" data-act="flowf" data-s="${k}"><span class="dotc" style="background:${PCL_COL[k]}"></span>${k}<b>${counts[k]||0}</b></div>`).join('')
   +`<div class="li" style="cursor:pointer"><span class="dotc" style="background:${PCL_DISPUTED}"></span>Disputed<b>${counts['Disputed']||0}</b></div>`;
}
function gisHTML(){
  const d=S.gDist?DAGG[S.gDist]:null;
  let cor=null,p=null;
  if(S.gDist&&S.gProj){p=prj(S.gProj);cor=corridorFor(p);}
  const vb=S.gvb?S.gvb.join(' '):null;
  let panel;
  if(!S.gDist){
    const topD=Object.keys(DAGG).filter(x=>DAGG[x]).sort((a,b)=>DAGG[b].prog-DAGG[a].prog).slice(0,8);
    panel=`<div class="card"><h3>Legend</h3><div class="csub">${S.mapMode==='status'?'District status = worst project status':S.mapMode==='progress'?'Avg acquisition progress':'Max project risk score'}</div>
      <div class="legend">
      ${S.mapMode==='status'?['On Track','At Risk','Delayed'].map(s=>`<div class="li"><span class="dotc" style="background:${ST_COL[s]}"></span>${s}<b>${Object.keys(DAGG).filter(x=>DAGG[x]&&DAGG[x].status===s).length}</b></div>`).join('')+`<div class="li"><span class="dotc" style="background:#e2e8f0"></span>No Projects<b>${33-Object.keys(DAGG).filter(x=>DAGG[x]).length}</b></div>`
       :S.mapMode==='progress'?`<div style="height:10px;border-radius:6px;background:linear-gradient(90deg,#f0f5f8,#7fd08f,#166534)"></div><div style="display:flex;justify-content:space-between;font-size:11px;color:#64748b"><span>0%</span><span>100% progress</span></div>`
       :`<div style="height:10px;border-radius:6px;background:linear-gradient(90deg,#fafcfd,#fbbf77,#b91c1c)"></div><div style="display:flex;justify-content:space-between;font-size:11px;color:#64748b"><span>0</span><span>100 risk</span></div>`}
      </div></div>
    <div class="card" style="margin-top:16px"><h3>Districts</h3><div class="csub">Click to inspect</div>
      ${topD.map(x=>`<div class="dbar" data-act="gsel" data-d="${esc(x)}"><span class="dn">${esc(x)}</span><div class="progbar"><i style="width:${DAGG[x].prog}%;background:${DAGG[x].prog>70?'#16a34a':DAGG[x].prog>50?'#f59e0b':'#ef4444'}"></i></div><span class="dv">${DAGG[x].prog}%</span></div>`).join('')}</div>`;
  } else if(!S.gProj){
    panel=`<div class="card">
      <div class="crumb" style="margin-bottom:10px"><span class="lnk" data-act="gclear">Telangana</span> ${ic('chevR',12)} <b>${esc(S.gDist)}</b></div>
      <h3 style="font-size:16px">${esc(S.gDist)}</h3>
      <div class="csub">${d?d.prjs.length+' active project'+(d.prjs.length>1?'s':'')+' · '+inr(d.land)+' ha proposed':'No active projects recorded'}</div>
      ${d?`<div class="mini-metrics" style="grid-template-columns:1fr 1fr;margin:0 0 12px">
        <div class="mm"><span>LAND PROPOSED</span><b>${inr(d.land)} ha</b></div>
        <div class="mm"><span>PROGRESS</span><b>${d.prog}%</b></div>
        <div class="mm"><span>FAMILIES</span><b>${inr(d.fam)}</b></div>
        <div class="mm"><span>RISK</span><b style="color:${d.risk>60?'#b91c1c':d.risk>40?'#b45309':'#15803d'}">${d.risk}/100</b></div></div>`:'<div class="ok-strip" style="margin:0">No land acquisition activity recorded in this district.</div>'}
      ${d?`<div style="font-weight:700;font-size:12px;color:#475569;margin:12px 0 6px">PROJECTS IN DISTRICT — click to open alignment</div>`+
        d.prjs.map(pid=>{const p2=prj(pid);return `<div class="dbar" data-act="gproj" data-id="${pid}" style="padding:9px 0;border-bottom:1px solid #eef1f6">
          <span class="dn" style="width:auto;flex:1"><b style="color:var(--ink)">${esc(p2.name)}</b><br><span style="font-size:11px;color:#94a3b8">${pid} · ${p2.sector}</span></span>
          <span class="badge ${ST_BG[p2.status]}">${p2.status}</span><span class="dv">${p2.prog}%</span></div>`;}).join('')
      :''}
    </div>`;
  } else {
    const counts={};cor.parcels.forEach(x=>counts[x.stage]=(counts[x.stage]||0)+1);
    const km=Math.round(cor.route.len*0.24);
    panel=`<div class="card">
      <div class="crumb" style="margin-bottom:10px"><span class="lnk" data-act="gclear">Telangana</span> ${ic('chevR',12)} <span class="lnk" data-act="gsel" data-d="${esc(S.gDist)}">${esc(S.gDist)}</span> ${ic('chevR',12)} <b>Alignment</b></div>
      <h3 style="font-size:15.5px">${esc(p.name)}</h3>
      <div class="csub">${p.id} · ${p.sector}</div>
      <div class="mini-metrics" style="grid-template-columns:1fr 1fr;margin:0 0 12px">
        <div class="mm"><span>ALIGNMENT</span><b>≈ ${km} km</b></div>
        <div class="mm"><span>LAND ACQUIRED</span><b style="color:#15803d">${p.acq}%</b></div>
        <div class="mm"><span>DISTRICTS</span><b>${p.dists.length}</b></div>
        <div class="mm"><span>CORRIDOR PARCELS</span><b>${cor.parcels.length}</b></div></div>
      <div style="font-weight:700;font-size:12px;color:#475569;margin:12px 0 2px">WORKFLOW ON MAP</div>
      <div class="hint" style="margin:0 0 8px">Green line = land acquired · dashed grey = alignment ahead · current stage: <b>${p.stage}</b>. Click a stage chip on the map to filter parcels.</div>
      <div style="font-weight:700;font-size:12px;color:#475569;margin:12px 0 6px">PARCEL STAGES</div>
      <div class="legend">${stageLegend(counts)}</div>
    </div>
    <div class="card" style="margin-top:16px"><div class="chead"><h3>Corridor Parcels</h3><span class="badge bg-gry">${S.flowFilter?esc(S.flowFilter)+' only':'All stages'}</span></div>
      <div style="max-height:300px;overflow:auto">
      <table class="tbl"><thead><tr><th>Survey No.</th><th>Owner</th><th>Area</th><th>Stage</th></tr></thead><tbody>
      ${cor.parcels.filter(x=>!S.flowFilter||x.stage===S.flowFilter||x.stage==='Disputed').map(x=>{const c=x.stage==='Disputed'?PCL_DISPUTED:PCL_COL[x.stage];
        return `<tr class="rowlink" data-act="psel" data-i="${cor.parcels.indexOf(x)}"><td><b>${x.survey}</b></td><td>${esc(x.owner)}<br><span class="gid">${esc(x.village)} · ${x.cat}</span></td><td class="num">${x.area} ha</td><td><span class="badge" style="background:${c}1c;color:${c}">${x.stage}</span></td></tr>`;}).join('')}
      </tbody></table></div></div>`;
  }
  const mapBody = cor?mapSVG({id:'gmap',mode:S.mapMode,selDist:S.gDist,vb,align:{pts:cor.route.pts,acq:p.acq,parcels:cor.parcels},routeDists:p.dists,style:'width:100%;height:auto;max-height:640px;display:block;margin:0 auto'})
    :mapSVG({id:'gmap',mode:S.mapMode,selDist:S.gDist,vb,style:'width:100%;height:auto;max-height:640px;display:block;margin:0 auto'});
  return `<div class="searchbar">
      <div style="font-weight:700;font-size:15.5px;flex:1">GIS Land Map ${S.gProj?'<span style="color:#94a3b8;font-weight:500">· Alignment View</span>':S.gDist?`<span style="color:#94a3b8;font-weight:500">· ${esc(S.gDist)}</span>`:'<span style="color:#94a3b8;font-weight:500">· Telangana State</span>'}</div>
      ${['status|Status','progress|Progress Heat','risk|Risk'].map(m=>{const[k,l]=m.split('|');return `<button class="modechip ${S.mapMode===k?'on':''}" data-act="mode" data-m="${k}">${l}</button>`;}).join('')}
    </div>
  <div class="gis-wrap">
    <div class="card" style="padding:10px">
      <div id="mapwrap" style="min-height:420px">
        ${mapBody}
        ${cor?`<div class="mapbadge"><b>${esc(p.name)}</b><br>Alignment ≈ ${Math.round(cor.route.len*0.24)} km · ${p.dists.length} districts · ${cor.parcels.length} parcels · <span style="color:#6ee7a0">${p.acq}% acquired</span></div>`:''}
        ${cor?flowStrip(p):''}
        <div id="maptip"></div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;padding:8px 6px 4px;flex-wrap:wrap">
        ${S.gDist?`<button class="btn btn-outline btn-sm" data-act="gclear">${ic('back',14)} State View</button>`:''}
        ${S.flowFilter?`<button class="btn btn-blue-soft btn-sm" data-act="flowf" data-s="">✕ Clear stage filter: ${esc(S.flowFilter)}</button>`:''}
        <span style="flex:1"></span>
        <button class="sqbtn" data-act="gz" data-z="in">${ic('plus',15)}</button>
        <button class="sqbtn" data-act="gz" data-z="out">−</button>
        <button class="sqbtn" data-act="gz" data-z="reset">${ic('map',14)}</button>
      </div>
    </div>
    <div class="gis-panel" style="display:flex;flex-direction:column;gap:0">${panel}</div>
  </div>`;
}

function mountMap(id,o){
  const svg=document.getElementById(id);if(!svg)return;
  const tip=document.getElementById('maptip');
  const wrap=svg.parentElement;
  svg.querySelectorAll('.md').forEach(pa=>{
    pa.addEventListener('mousemove',e=>{
      const dn=pa.dataset.d,a=DAGG[dn],r=wrap.getBoundingClientRect();
      tip.style.display='block';tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';
      tip.innerHTML=`<b>${esc(dn)}</b><br>`+(a?`${a.prjs.length} project(s) · ${a.prog}% avg progress<br>${inr(a.land)} ha proposed · risk ${a.risk}/100`:'No active projects');
    });
    pa.addEventListener('mouseleave',()=>tip.style.display='none');
    if(o.clickDist)pa.addEventListener('click',()=>{if(mountMap._moved)return;o.clickDist(pa.dataset.d);});
  });
  if(o.parcels){
    svg.querySelectorAll('.pcl').forEach(pl=>{
      const x=o.parcels[+pl.dataset.p];
      pl.addEventListener('mousemove',e=>{
        const r=wrap.getBoundingClientRect();tip.style.display='block';
        tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';
        tip.innerHTML=`<b>${x.survey}</b> · ${x.stage}${x.stage==='Disputed'?' ⚠':''}<br>${esc(x.owner)} · ${x.area} ha<br>${esc(x.village)} · workflow position ${(x.t*100).toFixed(0)}%`;});
      pl.addEventListener('mouseleave',()=>tip.style.display='none');
      if(o.parcelClick)pl.addEventListener('click',()=>{if(!mountMap._moved)o.parcelClick(+pl.dataset.p);});
    });
  }
  if(o.pan){
    let drag=null;mountMap._moved=false;
    svg.addEventListener('mousedown',e=>{const vb=svg.viewBox.baseVal;drag={x:e.clientX,y:e.clientY,vb:[vb.x,vb.y,vb.width,vb.height]};mountMap._moved=false;});
    window.addEventListener('mousemove',e=>{
      if(!drag)return;
      if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4)mountMap._moved=true;
      if(!mountMap._moved)return;
      const r=svg.getBoundingClientRect(),k=drag.vb[2]/r.width;
      const nvb=`${drag.vb[0]-(e.clientX-drag.x)*k} ${drag.vb[1]-(e.clientY-drag.y)*k} ${drag.vb[2]} ${drag.vb[3]}`;
      svg.setAttribute('viewBox',nvb);S.gvb=nvb.split(' ').map(Number);
    });
    window.addEventListener('mouseup',()=>drag=null);
  }
}
function gzoom(z){
  const svg=document.getElementById('gmap');if(!svg)return;
  if(z==='reset'){S.gvb=null;render();return;}
  const vb=svg.getAttribute('viewBox').split(' ').map(Number);
  const f=z==='in'?0.76:1.3,cx=vb[0]+vb[2]/2,cy=vb[1]+vb[3]/2,w=vb[2]*f,h=vb[3]*f;
  svg.setAttribute('viewBox',`${cx-w/2} ${cy-h/2} ${w} ${h}`);S.gvb=[cx-w/2,cy-h/2,w,h];
}

function projDates(p){
  const R=rng(p.id+'dates');const st=new Date(p.started+'T00:00:00');const out=[];let d=new Date(st);
  const idx=STAGES.indexOf(p.stage);
  for(let i=0;i<=idx;i++){out.push(d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}));d=new Date(d.getTime()+(40+R()*60)*864e5);}
  return out;
}

        ${p.dists.map(dn=>{const a=DAGG[dn]||{prog:0};return `<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px"><b>${esc(dn)}</b><span style="color:#64748b">${a.prog}% progress</span></div>

  } else if(S.projTab==='parcels'){

const bboxOf=n=>MAP.districts.find(d=>d.n===n).b;
function fitVB(n){
  const b=bboxOf(n);let w=b[2]-b[0],h=b[3]-b[1];const px=w*0.1,py=h*0.1;
  if(w<MAP.w*0.22){const g=(MAP.w*0.22-w)/2;return [b[0]-px-g,b[1]-py,w+2*px+2*g,h+2*py+2*g];}
  return [b[0]-px,b[1]-py,w+2*px,h+2*py];
}

    <div class="kpi"><div><div class="kl">Paid via DBT</div><div class="kv" style="color:#15803d">₹ ${inr(paidCr)} Cr</div><span class="delta-up">${Math.round(paidCr/total*100)}% disbursed</span></div><div class="kb" style="background:#e8f7ee;color:#16a34a">${ic('check',19)}</div></div>
    <div class="kpi"><div><div class="kl">Pending</div><div class="kv" style="color:#b91c1c">₹ ${inr(Math.max(total-paidCr,0))} Cr</div><span class="delta-dn">${rows.filter(r=>!r.paid).length} families in view</span></div><div class="kb" style="background:#fdeaea;color:#ef4444">${ic('warn',19)}</div></div></div>
  ${pid==='NLAMS-TG-003'&&rows.some(r=>!r.paid)?`<div class="warn-strip">${ic('warn',16)}<div><b>Alert A-101:</b> 32 families beyond 90-day SLA. Release pending payments or flag for Lok Adalat.</div></div>`:`<div class="ok-strip">${ic('check',16)}<div>All payments for this project are within the 90-day SLA.</div></div>`}
  <div class="card" style="padding:0"><div style="padding:16px 16px 8px;overflow:auto">
  <table class="tbl"><thead><tr><th>Family ID</th><th>Head of Family</th><th>Village</th><th class="num">Award (₹)</th><th>Bank / CFMS</th><th>Status</th><th></th></tr></thead><tbody>
  ${rows.map(f=>`<tr><td class="gid">${f.id}</td><td>${esc(f.head)} <span class="gid">(${f.cat})</span></td><td>${esc(f.village)}</td><td class="num">₹ ${inr(f.award*100000)}</td>
    <td style="font-size:12px">${esc(f.head.split(' ').pop().toUpperCase())}B******** · SBI</td>
    <td>${f.paid?'<span class="badge bg-grn">Paid</span>':'<span class="badge bg-amb">Pending</span>'}</td>
    <td>${f.paid?'<span class="gid">UTR 20'+Math.floor(10000000000+parseFloat("0."+f.id.replace(/\D/g,''))*8999999999)+'</span>':`<button class="btn btn-blue-soft" data-act="pay" data-pid="${pid}" data-fid="${f.id}" data-amt="${f.award}">${ic('rupee',13)} Release</button>`}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}

/* ---------- ALERTS ---------- */
function alertsHTML(){
  const cnt=s=>ALERTS.filter(a=>a.sev===s).length;
  return `<div class="phead" style="margin-bottom:16px"><div><h2 style="font-size:19px">Alerts &amp; Risk Intelligence</h2>
    <div style="color:var(--mut);font-size:12.5px;margin-top:3px">Rule-engine + early-warning scoring across ${PROJECTS.length} projects</div></div></div>
  <div class="grid kpis" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
    ${[['Critical','#ef4444','fdeaea'],['High','#f59e0b','fef3df'],['Medium','#3b82f6','e8effd'],['Info','#94a3b8','eef1f6']].map(s=>`
    <div class="kpi"><div><div class="kl">${s[0]} Alerts</div><div class="kv" style="color:${s[1]}">${cnt(s[0])}</div></div>
    <div class="kb" style="background:#${s[2]};color:${s[1]}">${ic('warn',19)}</div></div>`).join('')}</div>
  <div class="alist">${ALERTS.map(a=>alertCard(a)).join('')}</div>`;
}

/* ---------- modals ---------- */
function reviewModal(id){
  const x=SPROPS.find(s=>s.id===id);
  openModal(`<h3>Review — ${esc(x.name)}</h3><div class="msub">${x.id} · ${esc(x.dist)} district · ${x.land} ha · ${x.fam} families</div>
  <table class="tbl"><tbody>
  <tr><td style="color:#64748b">Legal checklist (Rule 5, Form-4)</td><td>${['Land schedule ✓','Market value certificate ✓','District NOC ✓','Social impact screening ✓','Environment screen ✓','Public purpose justification ✓'].map(d=>`<div style="font-size:12.5px;padding:2px 0;color:#15803d">${d}</div>`).join('')}</td></tr>
  <tr><td style="color:#64748b">Land details</td><td>${x.land} ha · ${x.sector} · Govt land 12 ha, Patta 148 ha</td></tr>
  <tr><td style="color:#64748b">Risk check</td><td><span class="badge bg-grn">Low — no litigation found in Dharani &amp; court records</span></td></tr></tbody></table>
  <div style="display:flex;gap:10px;margin-top:18px">
    <button class="btn btn-primary btn-sm" data-act="decide" data-id="${id}" data-dec="Approved">✔ Approve → Sec-11 Queue</button>
    <button class="btn btn-outline btn-sm" data-act="decide" data-id="${id}" data-dec="Sent Back">↩ Send Back</button>
    <button class="btn btn-outline btn-sm" data-act="decide" data-id="${id}" data-dec="Rejected" style="color:#b91c1c;border-color:#fca5a5">✖ Reject</button></div>`);
}
function parcelModal(pid,dn,idx){
  const p=prj(pid);const x=parcelsFor(p)[idx];
  openModal(`<h3>Parcel ${x.survey}</h3><div class="msub">${esc(p.name)} · ${esc(dn)} · ${esc(x.village)} village</div>
  <table class="tbl"><tbody>
  <tr><td style="color:#64748b">Owner</td><td><b>${esc(x.owner)}</b> <span class="gid">(${x.cat})</span></td></tr>
  <tr><td style="color:#64748b">Area</td><td>${x.area} ha</td></tr>
  <tr><td style="color:#64748b">Workflow stage</td><td><span class="badge" style="background:${x.stage==='Disputed'?PCL_DISPUTED:PCL_COL[x.stage]}1c;color:${x.stage==='Disputed'?PCL_DISPUTED:PCL_COL[x.stage]}">${x.stage}</span></td></tr>
  <tr><td style="color:#64748b">Est. Award Value</td><td>₹ ${inr(x.value*100000)}</td></tr>
  <tr><td style="color:#64748b">GPS / GIS</td><td>✔ Cadastral-matched · Dharani sync ${x.stage==='Compensated'||x.stage==='Possession'?'complete':'in progress'}</td></tr></tbody></table>
  <div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-primary btn-sm" data-act="proj" data-id="${pid}">Open Project</button></div>`);
}

function alertCard(a){
  const c=a.sev==='Critical'?'#ef4444':a.sev==='High'?'#f59e0b':a.sev==='Medium'?'#3b82f6':'#94a3b8';
  return `<div class="alitem" style="border-left-color:${c}">
    <div class="ah"><span class="riskchip" style="background:${c}1a;color:${c}">${a.sev.toUpperCase()}</span> ${esc(a.title)}
    <span style="margin-left:auto;font-weight:800;font-size:12.5px;color:${c}">${a.score}/100</span></div>
    <p>${esc(a.desc)}</p>
    <div class="act">${ic('check',13)} Recommended: ${esc(a.action)}</div>
    <div class="gid" style="margin-top:8px">${a.id} · <span class="lnk" data-act="proj" data-id="${a.prj}">${a.prj} — ${esc(prj(a.prj).name)}</span> · ${a.when}</div></div>`;
}

</script>
<script>
/* ===== 13 · APP — render loop, map wiring, events, boot + session ===== */
function render(){
  const app=document.getElementById('app');
  if(!S.user){app.innerHTML=loginHTML();return;}
  let c='',t='Dashboard',s='Overview of land acquisition activities across Telangana';
  switch(S.page){
    case 'projects':t='Projects';s=PROJECTS.length+' active projects across Telangana';c=projectsHTML();break;
    case 'project':t='Project Details';c=projHTML(S.project);break;
    case 'gis':t='GIS Land Map';s='Cadastral parcel intelligence — 33 districts';c=gisHTML();break;
    case 'acquisition':t='Acquisition';c=acqHTML();break;
    case 'compensation':t='Compensation';c=compHTML();break;
    case 'alerts':t='Alerts & Risk';c=alertsHTML();break;
    default:c=dashboardHTML();
  }
  app.innerHTML=shell(c,t,s);
  afterRender();
  saveSession();
}
function afterRender(){
  const dm=document.getElementById('dmap');
  if(dm)mountMap('dmap',{clickDist:d=>{S.page='gis';S.gDist=d;S.gProj=null;S.gvb=fitVB(d);render();}});
  const gm=document.getElementById('gmap');
  if(gm)mountMap('gmap',{pan:true,clickDist:d=>{S.gDist=d;S.gProj=null;S.gvb=fitVB(d);render();},
    parcels:S.gProj?parcelsFor(prj(S.gProj)):null,
    parcelClick:S.gProj?i=>parcelModal(S.gProj,S.gDist,i):null});
  const pm=document.getElementById('pmap');
  if(pm&&S.page==='project'&&S.projTab==='parcels'&&S.project){const p=prj(S.project);if(p)mountMap('pmap',{parcels:parcelsFor(p),parcelClick:i=>parcelModal(p.id,null,i)});}
  if(document.getElementById('aw-out'))awardCalc();
}
function awardCalc(){
  const area=parseFloat(document.getElementById('aw-area')?.value)||0;
  const mv=parseFloat(document.getElementById('aw-mv')?.value)||0;
  const mult=parseFloat(document.getElementById('aw-mult')?.value)||1;
  const yrs=parseFloat(document.getElementById('aw-years')?.value)||0;
  const base=area*mv*mult,add=base*0.12*yrs,sol=(base+add),tot=base+add+sol;
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  set('aw-base','₹ '+base.toFixed(2)+' L');
  set('aw-add','₹ '+add.toFixed(2)+' L');
  set('aw-sol','₹ '+sol.toFixed(2)+' L');
  set('aw-tot','₹ '+tot.toFixed(2)+' L');
  const pid=S.awPrj||'NLAMS-TG-006';
  set('aw-perfam','₹ '+(tot/Math.max(prj(pid).fam,1)*100000).toFixed(0));
}
function doLogin(demo){
  const role=demo?'State Authority (Telangana)':(document.getElementById('lg-role')?.value||'State Authority (Telangana)');
  const names={'Central Authority':'S. Raghunandan IAS','State Authority (Telangana)':'A. Sailaja IAS','District Authority':'R. Venkat Reddy','Field Officer':'M. Anjaneyulu'};
  S.user={name:names[role]||'A. Sailaja IAS',role};S.page='dashboard';
  toast('Welcome '+S.user.name.split(' ').slice(0,2).join(' ')+' — '+role,'ok');
  render();
}

/* ---------- global event delegation ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  switch(act){
    case 'login':doLogin(false);break;
    case 'demo':doLogin(true);break;
    case 'logout':clearSession();S.user=null;render();break;
    case 'nav':S.page=el.dataset.p;if(el.dataset.s)S.acq=el.dataset.s;render();break;
    case 'acq':S.page='acquisition';S.acq=el.dataset.s;render();break;
    case 'proj':S.page='project';S.project=id;S.projTab='overview';closeModal();render();break;
    case 'ptab':S.projTab=el.dataset.t;render();break;
    case 'mode':S.mapMode=el.dataset.m;render();break;
    case 'gz':gzoom(el.dataset.z);break;
    case 'gsel':case 'gopen':{S.page='gis';if(act==='gsel'){S.gDist=el.dataset.d;S.gProj=null;}else{S.gDist=el.dataset.d||S.gDist;S.gProj=el.dataset.id||S.gProj||null;}S.flowFilter=null;S.gvb=S.gProj?fitRouteVB(prj(S.gProj)):fitVB(S.gDist);render();break;}
    case 'gproj':{const p=prj(id);S.page='gis';S.gProj=id;S.gDist=p.dists[0];S.gvb=fitRouteVB(p);S.flowFilter=null;render();break;}
    case 'gclear':S.gDist=null;S.gProj=null;S.gvb=null;S.flowFilter=null;render();break;
    case 'psel':parcelModal(S.gProj,null,+el.dataset.i);break;
    case 'psel2':parcelModal(S.project,null,+el.dataset.i);break;
    case 'flowf':S.flowFilter=el.dataset.s||null;render();break;
    case 'modal-x':closeModal();break;
    case 'review':reviewModal(id);break;
    case 'decide':{const x=SPROPS.find(s=>s.id===id);x.status=el.dataset.dec;closeModal();
      toast(x.status==='Approved'?x.id+' approved → moved to Sec-11 Notification queue':'Proposal '+x.status.toLowerCase(),x.status==='Approved'?'ok':'warn');render();break;}
    case 'gennotif':{const pid=id;const p=prj(pid)||SPROPS.find(x=>x.id===pid);
      SNOTIF.unshift({no:'TG/Sec11/2026/0'+(41+SNOTIF.length+1),pid,date:'27 Aug 2026',land:p.land||0,fam:p.fam||0,status:'Published'});
      toast('Notification '+SNOTIF[0].no+' published to Gazette','ok');render();break;}
    case 'vfy':S.verDone[el.dataset.pid].add(el.dataset.pcl);toast('Parcel '+el.dataset.pcl+' GPS-verified & matched with Dharani','ok');render();break;
    case 'genaward':toast('Award draft generated → sent to DLAO for e-signature','ok');break;
    case 'posnotice':toast('Possession notice (Sec-38) issued for '+id,'ok');break;
    case 'pay':{S.paid[el.dataset.pid+':'+el.dataset.fid]=1;
      toast('₹ '+(parseFloat(el.dataset.amt)*100000).toLocaleString('en-IN')+' released to '+el.dataset.fid+' via CFMS-DBT','ok');render();break;}
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id==='proposal-form'){
    e.preventDefault();
    const name=document.getElementById('np-name').value||'Untitled Proposal';
    SPROPS.unshift({id:'PROP-TG-'+(17+SPROPS.length-2),name,dist:document.getElementById('np-dist').value,
      land:+document.getElementById('np-land').value||0,fam:+document.getElementById('np-fam').value||0,
      sector:document.getElementById('np-sector').value,docs:5,status:'Pending'});
    S.page='acquisition';S.acq='scrutiny';render();
    toast('Proposal submitted → now in Scrutiny queue','ok');
  }
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='prj-q'){S.scrQ=e.target.value;const tb=document.getElementById('prj-tbody');
    if(tb){const q=S.scrQ.toLowerCase();
      tb.innerHTML=PROJECTS.filter(p=>!q||p.name.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)||p.dists.join(' ').toLowerCase().includes(q)).map(prjRow).join('');}}
  if(id&&id.startsWith('aw-')&&id!=='aw-out')awardCalc();
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='ver-prj'){S.verPrj=e.target.value;render();}
  if(id==='pay-prj'){S.payPrj=e.target.value;render();}
  if(id==='aw-prj'){S.awPrj=e.target.value;render();}
  if(id==='aw-mult')awardCalc();
});

/* seed verification state + boot (restores session after refresh) */
PROJECTS.forEach(p=>{const pd=parcelsFor(p);const b=Math.round(pd.length*p.acq/100);
  for(let i=0;i<b;i++)S.verDone[p.id].add(pd[i].id);});
window.S=S;
/* backend connectivity probe — SPA degrades gracefully to offline mode */
(function(){
  try{
    fetch('/api/health').then(r=>r.json()).then(j=>{
      if(j&&j.ok){const b=document.getElementById('api-badge');
        if(b){b.textContent='◉ API connected · '+j.service;b.style.color='#16a34a';}}
    }).catch(()=>{});
  }catch(e){}
})();
(function boot(){
  const sess=loadSession();
  if(sess&&sess.u){
    S.user=sess.u;S.page=sess.p||'dashboard';S.project=sess.pr;S.projTab=sess.pt||'overview';
    S.acq=sess.aq||'scrutiny';S.gDist=sess.gd;S.gProj=sess.gp;S.gvb=sess.gv;S.mapMode=sess.mm||'status';
  }
  render();
})();

</script>
</body>
</html>
