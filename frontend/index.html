<!--
  ─────────────────────────────────────────────────────────────────────
  NLAMS · Telangana — development entry point (tree-structured build)

  PROJECT TREE
  ├── frontend/index.html   ← you are here (SPA entry, loads the src tree)
  ├── frontend/src/         ← css · js modules · assets
  ├── backend/src/          ← REST API (Node std-lib) + schema.sql
  ├── dist/index.html       ← single-file bundle (offline demo, generated)
  ├── css → frontend/src/css
  ├── js → frontend/src/js
  │   ├── 01-config.js      constants · stages · parcel palette
  │   ├── 02-utils.js       DOM/format helpers · icons · toasts · modals
  │   ├── 03-map-data.js    Telangana geometry (generated from GeoJSON)
  │   ├── 04-data.js        demo dataset (projects/alerts/users)
  │   ├── 05-engine.js      GIS engine · route alignment · corridors
  │   ├── 06-state.js       app state · session persistence
  │   ├── 07-views-login.js
  │   ├── 08-views-shell.js
  │   ├── 09-views-dashboard.js
  │   ├── 10-views-gis.js   map rendering · drill-down · zoom/pan
  │   ├── 11-views-projects.js
  │   ├── 12-views-modules.js  acquisition · compensation · alerts
  │   └── 13-app.js         render loop · events · boot
  ├── assets/               emblem · login background
  ├── data/telangana.geojson
  ├── tools/                build_map.py · build.py · smoke.js
  └── docs/                 SIH submission + pitch decks

  Rebuild the offline single file:  python3 tools/build.py
  Run regression checks:            node tools/smoke.js
  ─────────────────────────────────────────────────────────────────────
-->
